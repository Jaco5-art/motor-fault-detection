seed: 42
motors: [1, 2, 3, 4, 5, 6]
signals: [position, temperature, voltage]
window:
  length: 200
  stride: 10
  label_rule: any
  min_fault_points: 1
scaling:
  type: per_channel_standard
  fit_scope: train_raw_timesteps_only
cleaning:
  zscore_replacement: false
  missing_value_policy: fail_fast
selection_note: >-
  Window 200 was selected over 400 using Validation only in Phase 2. It retains
  all three Validation runs and improved every baseline. Window 800 is infeasible
  because neither labeled Validation fault run reaches 800 points.
