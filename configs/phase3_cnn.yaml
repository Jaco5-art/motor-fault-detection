experiment:
  name: phase3_cnn
  seed: 42
  test_access: forbidden
  deterministic: true

data:
  window_length: 200
  input_channels: 18
  output_motors: 6
  batch_size: 64
  num_workers: 0

training:
  loss: weighted_bce_with_logits
  class_weight_scope: train_only_per_motor
  positive_weight_cap: 30.0
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 60
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0001
  early_stopping_metric: m6_validation_pr_auc
  architecture_selection_rule: >-
    Select the smallest candidate within 0.005 absolute M6 Validation PR-AUC
    of the best candidate; this prevents negligible gains from choosing a much
    larger network.
  near_best_pr_auc_tolerance: 0.005
  gradient_clip_norm: 1.0

thresholds:
  selection: hybrid_by_validation_support
  no_positive_fallback: validation_normal_percentile_95
  positive_supported_policy: validation_f1_optimal

candidates:
  compact:
    channels: [32, 64]
    kernels: [7, 5]
    dropout: 0.2
    pooling: avg_max
  wide:
    channels: [64, 128]
    kernels: [7, 5]
    dropout: 0.3
    pooling: avg_max
