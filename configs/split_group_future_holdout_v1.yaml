known_limitations:
  - Motors 1-5 have positive labels in only two runs, so all three splits cannot contain positives.
  - Validation positives are Motor 6 only; F1-optimal thresholds for Motors 1-5 are invalid.
  - Motors 1-5 therefore use a label-free Validation normal-score percentile threshold.
