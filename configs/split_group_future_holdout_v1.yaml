name: group_future_holdout_v1
frozen: true
seed: 42
group_key: run_id
rationale: >-
  Fixed group split with a strict future Test boundary. Test contains every labeled
  run from 2024-04-26 onward, including the independent six-motor fault run.
  Validation is drawn only from pre-Test history and includes one full-length normal
  run plus both 2024-04-25 Motor 6 failure runs, providing normal and fault windows
  for a shared validation threshold. Remaining historical runs form Train.
threshold_policy: >-
  Per-motor frozen thresholds: Validation F1-optimal where positives exist;
  otherwise the 95th percentile of that motor's Validation normal scores.
