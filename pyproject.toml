[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-fault-detection"
version = "1.0.0"
description = "Leakage-free multivariate multi-motor fault detection pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
baselines = ["xgboost>=2.0"]
deep = ["torch>=2.2", "xgboost>=2.0"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
motor-fault-predict = "motor_fault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"motor_fault.resources.gmm" = ["*.joblib", "*.json"]
